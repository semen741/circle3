<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Кружок — редактор</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <h2>Редактор кружка</h2>
  <div>
    <label>Начало (сек): <input id="start" type="number" min="0" step="0.1" value="0" /></label>
    <label>Конец (сек): <input id="end" type="number" min="0.1" step="0.1" value="10" /></label>
  </div>
  <div>
    <label><input type="checkbox" id="mute" checked /> Без звука</label>
    <label>Контраст: <input id="contrast" type="number" step="0.1" value="1.2" /></label>
    <label>Блюр: <input id="blur" type="number" step="1" value="0" /></label>
  </div>
  <button id="go">Сделать кружок</button>
  <script src="./app.js"></script>
</body>
</html>
