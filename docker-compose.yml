version: '3.9'
services:
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - '6379:6379'

  api:
    build: ./apps/api
    command: ["pnpm","start"]
    env_file: .env
    environment:
      - NODE_ENV=development
    ports:
      - "8080:8080"
    depends_on:
      - redis

  bot:
    build: ./apps/bot
    command: ["pnpm","start"]
    env_file: .env
    environment:
      - NODE_ENV=development
    ports:
      - "8081:8081"
    depends_on:
      - api

  worker:
    build: ./apps/worker
    command: ["pnpm","start"]
    env_file: .env
    environment:
      - NODE_ENV=development
    depends_on:
      - redis

  webapp:
    build: ./apps/webapp
    command: ["pnpm","dev","--host","0.0.0.0"]
    env_file: .env
    ports:
      - "5173:5173"
